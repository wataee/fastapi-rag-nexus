<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="s-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="s-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purple-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="14" fill="url(#s-bg)"/>
  <rect width="960" height="420" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect width="960" height="54" rx="14" fill="#0f172a" fill-opacity="0.9"/>
  <circle cx="32" cy="27" r="7" fill="#ef4444"/>
  <circle cx="52" cy="27" r="7" fill="#f59e0b"/>
  <circle cx="72" cy="27" r="7" fill="#10b981"/>
  <text x="105" y="32" font-family="monospace" font-size="12" fill="#94a3b8">StreamRAG EventSource Client — POST /api/v1/chat/stream</text>

  <!-- Telemetry badges -->
  <rect x="670" y="14" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="680" y="31" font-family="monospace" font-size="11" fill="#6ee7b7">TTFT 310ms</text>

  <rect x="765" y="14" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="774" y="31" font-family="monospace" font-size="11" fill="#818cf8">85 tok/s</text>

  <rect x="860" y="14" width="75" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="872" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">● ONLINE</text>

  <!-- Query Block -->
  <g transform="translate(32, 80)">
    <rect width="896" height="56" rx="8" fill="#312e81" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">USER PROMPT</text>
    <text x="20" y="44" font-family="sans-serif" font-size="13" fill="#f8fafc">Explain the Reciprocal Rank Fusion (RRF) formula and how hybrid scoring balances BM25 and dense embeddings.</text>
  </g>

  <!-- Live SSE Response Block -->
  <g transform="translate(32, 155)">
    <rect width="896" height="235" rx="8" fill="url(#s-card)" stroke="#334155" stroke-width="1"/>
    
    <!-- Citations Banner -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">GROUNDING CITATIONS:</text>
      <rect x="145" y="0" width="180" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="155" y="15" font-family="monospace" font-size="11" fill="#6ee7b7">📄 architecture_spec.md (92%)</text>
      <rect x="335" y="0" width="170" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="345" y="15" font-family="monospace" font-size="11" fill="#6ee7b7">📄 vector_index_hnsw.pdf (87%)</text>
    </g>

    <!-- Token Stream Content -->
    <g transform="translate(20, 65)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#f8fafc" line-height="24">
        Reciprocal Rank Fusion (RRF) evaluates item score across multiple search modalities:
      </text>
      <rect x="0" y="38" width="460" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="60" font-family="monospace" font-size="13" fill="#38bdf8">RRF_Score(d) = Σ [ 1.0 / ( k + Rank_i(d) ) ]   where k = 60</text>
      
      <text x="0" y="105" font-family="sans-serif" font-size="13.5" fill="#cbd5e1">
        Dense embeddings capture semantic intent via cosine distance in 1536-dimensional space,
      </text>
      <text x="0" y="130" font-family="sans-serif" font-size="13.5" fill="#cbd5e1">
        while BM25 guarantees exact keyword hits for rare identifiers and acronyms.
      </text>
      <rect x="525" y="117" width="8" height="16" fill="#6366f1"/>
      <text x="540" y="130" font-family="monospace" font-size="11" fill="#a5b4fc">← streaming chunk #38</text>
    </g>
  </g>
</svg>
